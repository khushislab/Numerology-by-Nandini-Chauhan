  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .floating-number {
      position: absolute;
      color: #F6C1D1;
      opacity: 0.12;
      pointer-events: none;
      transition: transform 0.4s ease-out, opacity 0.3s ease;
      font-weight: 700;
      line-height: 1;
      filter: blur(1px);
    }
    .floating-number.active {
      opacity: 0.3;
      filter: blur(0px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes softBlink {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(219, 39, 119, 0.4), 0 20px 25px -5px rgba(219, 39, 119, 0.08);
        border-color: rgba(244, 114, 182, 0.8);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(244, 114, 182, 0.35), 0 25px 35px -5px rgba(219, 39, 119, 0.25);
        border-color: rgba(190, 24, 93, 1);
      }
    }
    .blink-card {
      animation: softBlink 2.2s infinite ease-in-out;
    }
    @keyframes tagBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.96); }
    }
    .blink-tag {
      animation: tagBlink 1.5s infinite ease-in-out;
    }
  </style>
